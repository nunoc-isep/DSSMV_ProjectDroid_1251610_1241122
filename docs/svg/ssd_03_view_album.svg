;stroke-dasharray:2.0,2.0;" x1="48.6201" x2="451.6807" y1="243.3164" y2="243.3164"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="8.7915" x="60.6201" y="230.3159">4</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="367.269" x="73.4116" y="222.4512">shows cover, title, artists, year, track count, type and tracks</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="326.8599" x="73.4116" y="238.1807">and the Save to Library / Remove from Library button</text><line style="stroke:#000000;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="10" x2="496.3203" y1="252.3164" y2="252.3164"/><text fill="#000000" font-family="sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="293.2241" x="15" y="262.9727">[error (network, expired session, not found, rate limit)]</text><polygon fill="#181818" points="54.6201,284.3555,44.6201,288.3555,54.6201,292.3555,50.6201,288.3555" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="48.6201" x2="451.6807" y1="288.3555" y2="288.3555"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="8.3091" x="60.6201" y="283.2197">5</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="103.4668" x="72.9292" y="283.2197">informs the error</text><path d="M457,308.3555 L457,396.3555 L846,396.3555 L846,318.3555 L836,308.3555 L457,308.3555 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M836,308.3555 L836,318.3555 L846,318.3555 L836,308.3555 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="368.5576" x="463" y="325.9492">Albums with more than 50 tracks are fetched page by page.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="245.4258" x="463" y="341.6787">If opened from a scan, the album is also</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="148.9922" x="463" y="357.4082">added to the Recent list.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="266.9697" x="463" y="373.1377">The Library button depends on whether the</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="144.7012" x="463" y="388.8672">album is already saved.</text><!--SRC=[RL8zRzmm3DtrAnvkIW4dwTBbXW8T2sJAjLiNsg9ZuMp9fUXp_UzBMNVD1UXYy-izae-YHHDr6YwaZ1GTcH-NgMLnpk99SFYPMGwWZ6AucKH35sQAYiFnj6NbQSzMysF-D2SD_LRprTvfQxkTpvKl7hzUyKShFMTemYNm2egWiLqcLxDxNUKvGlZtmbcjUE1QXJNeW62XCaH9KVHGeUwStHM7nxjUmhf8l6VmfEHerAix9lBi7N3hR-0oy15vI6j6boui3JJeoCsjQuEDgKHBOojPefgppNmtpg-uszRtH1Sk-xw4LaWsFEEL9wD5Bsdw5sqNjSCu7ZE3HUmk3v5rJN9km7_c8EoHEUUGOeEO5BsrzGsa23s6AUYd_sqHOfzagWBij8wZTyu861BU1aNgRvS5lXLDSbLvIc9Z3tQWBv-lEzd-DZLhDzWmCxqnsct_FndsUuyqSxJClXSXTsIZlYiV33_cPANaJVCYIKc-SiVsb4OJjj3yiD17JU3PU7ssrujrOCD80HQUTrvXyXkoIUsVoef58luB]--></g></svg>